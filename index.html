<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon. All three are generated by scripts/favicons.js from one
         vector definition of the mark; the SVG is preferred where supported
         and the PNG is the fallback. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <meta name="theme-color" content="#0B1F3A" />

    <!--
      Per-route SEO tags (title, description, canonical, Open Graph, Twitter)
      are injected here at build time by scripts/prerender.js, and rendered at
      runtime by src/components/Seo.jsx. Both read src/seo/meta.js.
      Do not hardcode them here: a tag in this file appears on EVERY route,
      which is what previously made every page canonicalise to the homepage.
    -->
    <!--head-->

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preconnect for Cal.com embed -->
    <link rel="preconnect" href="https://app.cal.com" />
    <link rel="preconnect" href="https://cal.com" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
