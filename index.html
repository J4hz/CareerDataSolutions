<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon. All three are generated by scripts/favicons.js from one
         vector definition of the mark; the SVG is preferred where supported
         and the PNG is the fallback. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <meta name="theme-color" content="#0B1F3A" />

    <!--
      Per-route SEO tags (title, description, canonical, Open Graph, Twitter)
      are injected here at build time by scripts/prerender.js, and rendered at
      runtime by src/components/Seo.jsx. Both read src/seo/meta.js.
      Do not hardcode them here: a tag in this file appears on EVERY route,
      which is what previously made every page canonicalise to the homepage.
    -->
    <!--head-->

    <!--
      Fonts are self-hosted (public/fonts, generated by scripts/fonts.js), so
      there is no font origin left to preconnect to. Preloading them here is
      what makes self-hosting pay: the browser starts both files immediately
      instead of waiting for the CSS that names them to arrive first.
      Both are variable fonts, one file per family covering every weight.
    -->
    <link
      rel="preload"
      href="/fonts/inter.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      The preconnects to cal.com and app.cal.com are gone with them: there is
      no Cal.com embed on this site. Booking is an ordinary outbound link, so
      the connection cannot be opened early anyway. Restore them alongside
      the embed if one is ever added.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
